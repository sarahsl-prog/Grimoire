# Lint, type-check and unit tests. Both jobs are meant to be required checks.
#
# The lint job runs the same `pre-commit run --all-files` gate CLAUDE.md
# documents, in the `dev`-extra environment that gate is defined against (see
# the mypy hook's comments in .pre-commit-config.yaml).

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A new push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same uv the Dockerfile pins: uv.lock is revision 3, older uv cannot read it.
  UV_VERSION: "0.9.18"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dev environment
        run: uv sync --frozen --extra dev

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit (ruff, black, mypy, bandit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # The GUI tests drive real PySide6 widgets; no display on a runner.
      QT_QPA_PLATFORM: offscreen
    # The API's rate limiter stores counters in Redis at localhost:6379 (the
    # settings default). Tests pass without it (the limiter falls back to
    # in-memory counters; see tests/test_rate_limit_fallback.py), but running
    # Redis keeps the normal Redis-backed path exercised too.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # uv.lock resolves the CUDA build of torch (~5 GB with nvidia-* wheels);
      # the stock runner image does not leave enough disk for that plus caches.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Shared libraries PySide6 loads at import time. Without libEGL pytest-qt
      # aborts during plugin configure, before a single test is collected.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `all`, not `dev`: dev pulls in pytest-qt, which refuses to start
      # without the Qt binding that only the `gui` extra installs.
      - name: Install all extras
        run: uv sync --frozen --extra all

      # addopts in pyproject.toml already excludes tests/integration.
      - name: pytest
        run: >-
          uv run pytest
          --cov=grimoire
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --junitxml=pytest-results.xml

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-results.xml
          retention-days: 14
