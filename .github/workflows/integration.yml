# Integration tests against a Grimoire stack built from the PR's own code.
#
# tests/integration/test_live_api.py normally targets the deployed server.
# Here the same tests run against a throwaway docker compose stack (Postgres,
# Redis, ChromaDB, API) on the runner, so they exercise the change under review
# and never touch production. LLM-backed tests (`slow`) and the load tests in
# test_performance.py are excluded: there is no Ollama on the runner, and load
# numbers from a shared CI VM mean nothing.

name: Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.18"
  COMPOSE_PROJECT_NAME: grimoire-ci

jobs:
  live-api:
    name: Integration tests (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The compose file bind-mounts ./grimoire.yaml; env vars set in
      # docker-compose.yml override its localhost defaults inside containers.
      - name: Prepare config
        run: cp grimoire.yaml.example grimoire.yaml

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: grimoire:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Postgres and Redis both refuse to start without a password. Fresh
      # random values per run: the stack is torn down at the end of the job,
      # so nothing needs to know them beyond the compose interpolation.
      - name: Generate throwaway datastore passwords
        run: |
          # POSTGRES_READONLY_PASSWORD also exercises db-migrate's
          # `grimoire db readonly-role` step on every run.
          for var in POSTGRES_PASSWORD REDIS_PASSWORD POSTGRES_READONLY_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
          done

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 300 postgres redis chromadb api

      - name: Create CI API key
        id: key
        run: |
          out="$(docker compose exec -T api grimoire key create --tier agent --name ci-integration)"
          # The output shows the 12-char key prefix first and the full key
          # last; only the last match is a usable key.
          key="$(grep -oE 'grim_[a-z]{3}_[A-Za-z0-9_-]+' <<<"$out" | tail -n1)"
          if [ "${#key}" -le 12 ]; then key=""; fi
          if [ -z "$key" ]; then
            echo "::error::could not parse an API key from 'grimoire key create'"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "api_key=$key" >> "$GITHUB_OUTPUT"

      # The API loads the embedding model lazily, on the first search. On a
      # fresh runner that means downloading it too, which blows through the
      # tests' 30 s client timeout. Pay that cost here, once, with room to spare.
      - name: Warm up embedding model
        env:
          API_KEY: ${{ steps.key.outputs.api_key }}
        run: >-
          curl -sS --fail-with-body --max-time 600
          -H "X-API-Key: $API_KEY" -H "Content-Type: application/json"
          -d '{"query": "warm up", "top_k": 1}'
          http://localhost:8001/api/v1/query/search -o /dev/null

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          # Only pytest + httpx are installed here; not worth a cache entry.
          enable-cache: false

      # The live tests only speak HTTP, so a tiny ad-hoc env is enough; no
      # need to install Grimoire (and torch) on the host as well.
      - name: Run live API tests
        env:
          GRIMOIRE_TEST_API_BASE: http://localhost:8001
          GRIMOIRE_TEST_API_KEY: ${{ steps.key.outputs.api_key }}
        run: >-
          uv run --no-project --python 3.13
          --with pytest --with pytest-asyncio --with httpx
          pytest tests/integration/test_live_api.py
          -o addopts=""
          -p no:cacheprovider
          -m "not slow"
          -v --tb=short -ra

      - name: Dump service logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=300 api postgres chromadb redis

      - name: Tear down
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans
