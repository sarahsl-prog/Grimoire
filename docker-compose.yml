# Shared configuration for every container that runs the Grimoire image.
# Environment variables override grimoire.yaml — settings.py orders env above
# YAML — so the host's localhost defaults stay correct for bare-metal use
# while containers talk to service DNS names.
x-grimoire-env: &grimoire-env
  GRIMOIRE_CONFIG: /app/grimoire.yaml
  GRIMOIRE_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-grimoire}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grimoire}
  GRIMOIRE_VECTOR_STORE__HOST: chromadb
  GRIMOIRE_VECTOR_STORE__PORT: "8000"
  GRIMOIRE_REDIS__HOST: redis
  GRIMOIRE_REDIS__PORT: "6379"
  GRIMOIRE_REDIS__PASSWORD: ${REDIS_PASSWORD}
  GRIMOIRE_LOGGING__LOG_DIR: /app/logs
  GRIMOIRE_CACHE__PATH: /app/cache
  GRIMOIRE_API__UPLOAD_DIR: /app/uploads
  # Ollama stays on the host by default.  Set GRIMOIRE_OLLAMA_URL to retarget
  # a remote or containerized daemon.  No /v1 suffix — the agents append
  # /api/generate themselves.
  GRIMOIRE_LLM__URL: ${GRIMOIRE_OLLAMA_URL:-http://host.docker.internal:11434}
  # uvicorn only honours X-Forwarded-For from these addresses. Behind the
  # caddy proxy every request arrives from Caddy's container IP, so without
  # this the rate limiter (which keys unauthenticated requests by client IP)
  # would put the whole internet in one bucket. The default covers Docker's
  # private range, which includes grimoire-network (172.28/16) and the
  # security overlay's 172.29/16. Only containers on the network and the
  # host itself can send from these addresses.
  FORWARDED_ALLOW_IPS: ${GRIMOIRE_TRUSTED_PROXIES:-172.16.0.0/12}

x-grimoire-app: &grimoire-app
  image: grimoire:latest
  build:
    context: .
    dockerfile: Dockerfile
  environment: *grimoire-env
  env_file:
    - path: .env
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./grimoire.yaml:/app/grimoire.yaml:ro
    - model_cache:/home/grimoire
    - app_logs:/app/logs
    - app_cache:/app/cache
    - app_uploads:/app/uploads
  networks:
    - grimoire-network

services:
  # PostgreSQL 16 - Primary metadata database
  postgres:
    image: postgres:16-alpine
    container_name: grimoire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grimoire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-grimoire}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grimoire} -d ${POSTGRES_DB:-grimoire}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - grimoire-network
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=1310kB
        -c min_wal_size=1GB
        -c max_wal_size=4GB

  # Redis 7 - Cache and message broker
  redis:
    image: redis:7-alpine
    container_name: grimoire-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      # Authenticated, and matched on PONG: an unauthenticated ping gets a
      # NOAUTH error reply, which redis-cli doesn't treat as a failure.
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - grimoire-network
    # Refuse to start without a password, with a clear message (a ${VAR:?}
    # guard would break every compose command, even with Redis unused). The
    # password goes into a private config file rather than a --requirepass
    # argument, which anyone can read in the process list. The image's own
    # docker-entrypoint.sh is exec'd so Redis still drops from root to the
    # redis user and runs as PID 1 (clean shutdown on docker stop).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -n "$$REDIS_PASSWORD" ] ||
        { echo "redis: set REDIS_PASSWORD in .env" >&2; exit 1; };
        umask 077;
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf;
        chown redis:redis /tmp/redis-auth.conf;
        exec docker-entrypoint.sh redis-server /tmp/redis-auth.conf
        --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ChromaDB - Vector database
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: grimoire-chromadb
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      # No CHROMA_SERVER_AUTHN_* here on purpose: Chroma 1.x (Rust server)
      # removed built-in auth, so a token would be silently ignored. Access
      # control is network isolation: grimoire-network plus a 127.0.0.1-only
      # host port. See docs/deploy/docker.md#chromadb-access-control.
    ports:
      - "127.0.0.1:${CHROMADB_PORT:-8060}:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    # The chromadb/chroma image ships no curl, wget, or python — only a
    # shell and coreutils — so the healthcheck can't shell out to an HTTP
    # client. bash's /dev/tcp pseudo-device gives a real HTTP readiness
    # check without one: open a TCP socket, write a raw GET, and grep the
    # status line. Also: /api/v1/heartbeat now returns 410 Gone upstream;
    # /api/v2/heartbeat is the current endpoint.
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET /api/v2/heartbeat HTTP/1.0\r\n\r\n" >&3 && timeout 2 head -c 15 <&3 | grep -q "200 OK"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - grimoire-network
    # Note: ChromaDB defaults to in-memory if not configured for persistence
    # The IS_PERSISTENT flag enables disk-based storage

  # One-shot Alembic migration.  Gates every application container so the
  # schema is current before anything connects, and so no two containers
  # race to migrate.  Named db-migrate because `grimoire migrate` is an
  # unrelated vector-store command.
  db-migrate:
    <<: *grimoire-app
    container_name: grimoire-db-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # REST API.  Also serves authenticated MCP at /mcp/sse for clients that
  # would rather not use the dedicated service.
  api:
    <<: *grimoire-app
    container_name: grimoire-api
    restart: unless-stopped
    command:
      ["uvicorn", "grimoire.api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      # Loopback only: on a public VPS, Docker's published ports bypass UFW,
      # so the bind address is the firewall. Remote clients go through the
      # caddy service (profile "proxy") on 443.
      - "127.0.0.1:${GRIMOIRE_API_PORT:-8001}:8001"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Dedicated MCP server, restartable independently of the REST API.
  mcp:
    <<: *grimoire-app
    container_name: grimoire-mcp
    restart: unless-stopped
    command:
      ["uvicorn", "grimoire.mcp.app:app", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      # Loopback only; see the api service.
      - "127.0.0.1:${GRIMOIRE_MCP_PORT:-8100}:8100"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Filesystem watcher.  The corpus mounts read-only: the watcher ingests
  # from it and never needs to write back.
  watcher:
    <<: *grimoire-app
    container_name: grimoire-watcher
    restart: unless-stopped
    command: ["grimoire", "watch", "start", "/data/watch"]
    volumes:
      - ./grimoire.yaml:/app/grimoire.yaml:ro
      - model_cache:/home/grimoire
      - app_logs:/app/logs
      - app_cache:/app/cache
      - app_uploads:/app/uploads
      - ${GRIMOIRE_WATCH_DIR:-./documents}:/data/watch:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional: PGAdmin for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: grimoire-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@grimoire.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      # Loopback only. SERVER_MODE False means pgAdmin has no login screen
      # at all, so anyone who can reach this port is a database admin. Use
      # an SSH tunnel to reach it from another machine.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - grimoire-network
    depends_on:
      - postgres
    profiles:
      - tools

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: grimoire-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:${REDIS_PORT:-6379}
    ports:
      # Loopback only: redis-commander has no HTTP auth configured.
      - "127.0.0.1:${REDIS_COMMANDER_PORT:-8081}:8081"
    networks:
      - grimoire-network
    depends_on:
      - redis
    profiles:
      - tools

  # TLS reverse proxy for public deployments.  The only service allowed to
  # publish on every interface; everything else is 127.0.0.1-only.  Start it
  # with `docker compose --profile proxy up -d`.  Needs GRIMOIRE_DOMAIN (with
  # DNS pointing here) and ACME_EMAIL in .env.
  caddy:
    image: caddy:2.11.7-alpine
    container_name: grimoire-caddy
    restart: unless-stopped
    environment:
      GRIMOIRE_DOMAIN: ${GRIMOIRE_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    # Fail loudly when the domain is unset.  A compose-level ${VAR:?} guard
    # would break every `docker compose` command, even with this profile off,
    # because Compose interpolates inactive services too.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -n "$$GRIMOIRE_DOMAIN" ] && [ -n "$$ACME_EMAIL" ] ||
        { echo "caddy: set GRIMOIRE_DOMAIN and ACME_EMAIL in .env" >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys.  Keep this volume: losing it
      # means re-issuing, and Let's Encrypt rate-limits repeat issuance.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # The admin API answers on loopback inside the container only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - grimoire-network
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    profiles:
      - proxy

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local
  pgadmin_data:
    driver: local
  model_cache:
    driver: local
  app_logs:
    driver: local
  app_cache:
    driver: local
  app_uploads:
    driver: local

networks:
  grimoire-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
