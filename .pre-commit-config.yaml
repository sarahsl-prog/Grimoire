# Pre-commit hooks for Grimoire.
#
# Wires the four gates CLAUDE.md documents under "Code Quality"
# (ruff --fix, black, mypy, bandit), in that order, so
# `pre-commit run --all-files` is the same gate the docs promise.
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# Tool configuration (line length, target version, ignored rules, mypy
# strictness, per-module overrides, etc.) lives in pyproject.toml under
# [tool.ruff], [tool.black], and [tool.mypy] - not duplicated here.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
        # pre-commit hands each tool an explicit list of changed files, and
        # an explicit path overrides the exclusions in pyproject.toml. Both
        # hooks therefore need this filter, or a commit touching alembic/
        # gets those files reformatted despite [tool.ruff]/[tool.black]
        # excluding them. Verified: without it, a full run rewrote seven
        # migration files.
        exclude: ^(alembic|migrations)/

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        exclude: ^(alembic|migrations)/

  # mypy runs in the project's own environment, not in a throwaway one.
  #
  # The mirrored hook (pre-commit/mirrors-mypy) builds an isolated environment
  # containing only a hand-copied dependency list. That list can never match the
  # project: with slowapi, textual, docling and the rest missing, it reported 60
  # errors that do not exist in the real environment, and it contradicted the
  # `# type: ignore` comments that are only needed when an optional package is
  # installed (warn_unused_ignores flags them as unused there). See
  # docs/superpowers/plans/2026-10-03-precommit-triage.md.
  #
  # So this hook runs whatever `mypy` is on PATH. Run pre-commit inside the dev
  # environment: `uv run pre-commit run --all-files`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # `python -m mypy`, not bare `mypy`: a mypy earlier on PATH (pipx, uv tool)
        # lives outside the project env, cannot see click/pydantic, and reports
        # hundreds of bogus untyped-decorator errors. This uses the interpreter
        # that launched pre-commit, so install the dev extra: `uv sync --extra dev`.
        entry: python -m mypy
        language: system
        types: [python]
        files: ^grimoire/
        # mypy checks the whole package, not just the changed files: a change in
        # one module can break a caller in another, and mypy's own cache keeps a
        # full run fast.
        pass_filenames: false
        args: [grimoire/]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Scoped to grimoire/ only - tests/ legitimately uses assert and
        # writes to fixed tmp paths, both of which bandit flags by design.
        # (`-r` is omitted: pre-commit already passes bandit the explicit,
        # `files`-filtered file list rather than a directory to recurse.)
        files: ^grimoire/
